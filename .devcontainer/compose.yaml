# devcontainer 전용 오버라이드. compose.yaml 뒤에 겹쳐 읽힌다.
# bind mount·node_modules 볼륨·DATABASE_URL·env_file 은 베이스에서 그대로 상속된다.

services:
  app:
    # dev 서버는 컨테이너가 아니라 사람이 터미널에서 띄운다.
    command: sleep infinity
    environment:
      HISTFILE: /commandhistory/.bash_history
      # Dockerfile 의 dev 타깃은 NODE_ENV=development 를 박는다. 그 상태로 `pnpm build` 를
      # 돌리면 React 가 dev/prod 로 갈려 프리렌더가 깨진다("Cannot read properties of null
      # (reading 'useContext')"). 비워 두면 next 가 명령에 맞게 알아서 정한다.
      NODE_ENV: ""
    volumes:
      # 리빌드해도 로그인이 날아가지 않게 각 CLI 의 설정을 볼륨에 둔다.
      - claude_config:/root/.claude
      - gh_config:/root/.config/gh
      # Railway CLI 의 설정 경로는 플랫폼마다 다르다(맥은 ~/.railway).
      # 어느 쪽이 잡히든 로그인이 유지되도록 둘 다 볼륨으로 건다.
      - railway_config:/root/.config/railway
      - railway_home:/root/.railway
      - shell_history:/commandhistory
      # ⚠ 이 볼륨은 사실상 비어 있다. pnpm 은 store 가 프로젝트와 다른 드라이브에
      # 있으면 하드링크를 못 걸어 프로젝트 드라이브에 폴백 스토어를 만드는데,
      # /app 은 bind mount 고 /pnpm/store 는 볼륨이라 항상 다른 드라이브다.
      # 실제 캐시는 호스트 레포의 .pnpm-store 에 쌓이고(그래서 리빌드해도 남는다),
      # 그 폴더는 .dockerignore 에 있어야 한다 — 없으면 COPY . . 가 1.7GB 를
      # 이미지에 넣어 빌드가 no space left on device 로 죽는다.
      # 볼륨 자체는 무해해서 남겨 둔다(PNPM_HOME 설정이 바뀌면 다시 쓰인다).
      - pnpm_store:/pnpm/store
      # Playwright 브라우저도 같은 이유로 볼륨에 둔다. 리빌드마다 150MB 를 다시
      # 받지 않으려는 것이고, post-create 의 install 은 이미 있으면 즉시 끝난다.
      - playwright_browsers:/root/.cache/ms-playwright

volumes:
  claude_config:
  gh_config:
  railway_config:
  railway_home:
  shell_history:
  pnpm_store:
  playwright_browsers:
