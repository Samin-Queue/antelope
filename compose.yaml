name: samin-queue

services:
  db:
    # Railway 프로덕션과 동일한 이미지. pgvector 등 확장 구성이 같아야
    # "로컬에선 되는데" 가 안 생긴다.
    image: ghcr.io/railwayapp-templates/postgres-ssl:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samin_queue
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samin_queue"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/samin_queue
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # 컨테이너에서 설치한 node_modules 를 호스트 것으로 덮어쓰지 않는다
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  pgdata:
  node_modules:
  next_cache:
