name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # main 의 CI 는 배포 게이트다. 연속 푸시로 직전 커밋의 런이 취소되면 그 커밋은
  # 검사를 통째로 빠져나간다 — 빌드가 깨진 9bf30ea 가 실제로 그렇게 통과했다.
  # PR 브랜치에서는 최신 커밋 결과만 의미가 있으므로 취소해도 잃는 게 없다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 팀원이 Railway 콘솔 없이도 자기 코드가 깨졌는지 여기서 확인한다.
  build:
    name: format · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # better-auth 1.7.1 CLI 는 account.issuer 를 생성하지 않으면서 런타임에서는
      # 그 컬럼으로 조회한다. 누락되면 OAuth 콜백만 죽어 로컬에서는 안 드러난다.
      - name: better-auth 스키마 대조
        run: pnpm check:auth-schema

      # next build 에 타입체크가 포함된다
      - name: Build
        run: pnpm build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Railway 가 이 Dockerfile 로 배포한다. 여기서 깨지면 배포도 깨진다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Railway 의 GitHub 웹훅 자동배포는 워크스페이스 멤버가 아닌 계정의 push 를
  # NEEDS_APPROVAL 로 막는다(Hobby 플랜이라 팀원을 초대할 수 없다). CI 를 통과한
  # 커밋은 여기서 프로젝트 토큰으로 직접 배포해 그 게이트를 우회한다. 웹훅 연동은
  # 그대로 둔다 — 팀원 커밋마다 대시보드에 쓰지 않는 NEEDS_APPROVAL 배포가 남지만
  # 무해하다.
  deploy:
    name: railway deploy
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service web --environment production --ci
