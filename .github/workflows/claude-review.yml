name: Claude Review

# PR 마다 독립 Claude 에이전트가 적대적 검증 코드리뷰를 수행한다.
# newey 의 claude-review.yml 을 이 레포 전제(단일 Next 앱·GitHub hosted 러너·main 단일
# 브랜치·40시간 해커톤)에 맞춰 축소한 판이다.
#
# 동작: PR diff → 후보 발견 → 발견별로 반박 시도(적대적 검증) → 살아남은 것만 리뷰로 게시.
# 리뷰 본문 첫 줄은 반드시 `VERDICT: GO` 또는 `VERDICT: STOP` — 마지막 스텝이 이를 파싱해
# STOP 이면 잡을 실패시킨다.
#
# ⚠ 강제력의 한계: 무료 플랜 프라이빗 레포는 branch protection API 가 403 이라 required check
# 등록이 불가하다. STOP 은 "빨간 체크 + 리뷰 코멘트"까지고 머지 자체는 안 막힌다.
# 팀 규칙으로 운영한다 — STOP 해소 전 머지 금지.
#
# 비용: 지배 비용은 러너 분이 아니라 Claude API 토큰이다. draft·dependabot·문서 전용 PR 은
# 트리거하지 않고, 같은 PR 의 이전 실행은 취소한다.
# 우회: PR 에 `skip-claude-review` 라벨을 붙이고 실패한 잡을 re-run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "pnpm-lock.yaml"
      - ".vscode/**"

# 최신 커밋에 대한 판정만 의미가 있다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: 적대 리뷰 + 판정
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # dependabot 은 시크릿을 못 받아 무조건 실패한다. draft 는 토큰만 태운다.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false

    steps:
      - name: 스킵 라벨 확인
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 라벨은 이벤트 페이로드가 아니라 라이브로 재조회한다 — re-run 에서 즉시 반영된다.
          labels=$(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '[.labels[].name] | join(",")')
          if printf '%s' "$labels" | grep -q 'skip-claude-review'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip-claude-review 라벨이 있어 건너뜁니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 시크릿 확인
        if: steps.skip.outputs.skip == 'false'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 없습니다. 레포 또는 org Settings → Secrets 에 추가하세요."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: steps.skip.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - name: 모델 라우팅
        id: model
        if: steps.skip.outputs.skip == 'false'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # 문서·락파일은 규모 산정에서 뺀다.
          changed=$(git diff --numstat "$base" "$head" -- . ':(exclude)*.md' ':(exclude)pnpm-lock.yaml' \
            | awk '{added+=$1; removed+=$2} END {print added+removed+0}')
          echo "변경 라인: $changed"
          if [ "$changed" -gt 600 ]; then
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude 적대 리뷰
        id: review
        if: steps.skip.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model ${{ steps.model.outputs.model }} --max-turns 30
          prompt: |
            이 PR 의 diff 를 리뷰한다. 목표는 **머지해도 되는가**에 대한 판정이다.

            먼저 `gh pr diff ${{ github.event.pull_request.number }}` 로 변경을 읽고,
            필요하면 주변 파일을 열어 맥락을 확인한다. `AGENTS.md` 의
            "지우면 안 되는 것들" 표는 반드시 읽고 대조한다.

            ## 절차

            1. 후보 발견을 찾는다. 우선순위 순으로:
               - 정확성 버그 — 특정 입력·상태에서 잘못된 결과나 크래시가 나는 것
               - AGENTS.md "지우면 안 되는 것들" 위반
               - 보안 회귀 — 키 노출, 검증 없는 입력, 인젝션
               - 배포를 깨는 변경 — Dockerfile·railway.json·CI·환경변수
            2. 발견마다 **반박을 시도한다.** "이게 실제로 문제가 되는 구체적 입력·상태가
               있는가?" 를 스스로 묻고, 못 대면 버린다. 확신이 없으면 버리는 쪽을 택한다.
            3. 반박에 실패한 것만 남긴다. 발견이 0건이면 그것이 정상이다 —
               억지로 만들지 않는다.

            ## 리뷰하지 않는 것

            - 스타일·포맷 — Prettier 와 ESLint 가 CI 에서 이미 강제한다
            - 테스트 부재 — 이 레포에 테스트 스위트가 없다는 것은 알려진 사실이다
            - 취향 문제, 리팩터링 제안, "이렇게 하면 더 좋을 것 같다"

            ## 출력 형식

            **최종 응답 전체가 리뷰 본문으로 그대로 게시된다.** 진행 상황이나 인사말을
            쓰지 않는다. 첫 줄은 반드시 다음 둘 중 하나이고, 앞에 아무것도 붙이지 않는다.

            - `VERDICT: STOP` — 머지 전에 반드시 고쳐야 할 발견이 있다
            - `VERDICT: GO` — 없다

            그 다음 줄부터 발견을 쓴다. 발견마다 `파일:줄`, 무엇이 잘못됐는지 한 문장,
            그리고 **실패 시나리오**(구체적 입력·상태 → 잘못된 결과)를 적는다.
            한국어로 쓴다.

      - name: 리뷰 게시 + 판정 게이트
        if: steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::에이전트 실행 결과 파일이 없습니다. 위 스텝 로그를 확인하세요."
            exit 1
          fi

          # 최종 텍스트를 꺼낸다. result 이벤트가 우선이고, 없으면 마지막 assistant 메시지.
          body=$(jq -r '
            (if type == "array" then . else [.] end) as $events
            | (($events | map(select(.type == "result") | .result // empty) | last)
               // ($events
                   | map(select(.type == "assistant")
                         | .message.content[]? | select(.type == "text") | .text)
                   | last)
               // "")
          ' "$EXECUTION_FILE")

          if [ -z "$body" ]; then
            echo "::error::리뷰 본문이 비어 있습니다 (무판정). 잡을 re-run 하세요."
            exit 1
          fi

          verdict=$(printf '%s' "$body" | head -1)
          echo "판정: $verdict"

          printf '%s\n' "$body" > /tmp/review-body.md
          gh pr review "$PR" --repo "${{ github.repository }}" --comment --body-file /tmp/review-body.md

          case "$verdict" in
            *"VERDICT: STOP"*)
              echo "::error::STOP 판정입니다. PR 코멘트의 발견을 해소한 뒤 다시 푸시하세요."
              exit 1
              ;;
            *"VERDICT: GO"*)
              echo "통과."
              ;;
            *)
              echo "::error::첫 줄에서 VERDICT 를 찾지 못했습니다: $verdict"
              exit 1
              ;;
          esac
